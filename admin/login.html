<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الإدارة - متجر البيض</title>
<link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page-body">
<div class="login-box">
<div class="card">
<h2 class="card-title" style="text-align:center">🔐 دخول لوحة الإدارة</h2>
<form id="loginForm">
<div class="form-group"><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"></div>
<div class="form-group"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"></div>
<button class="btn btn-primary" type="submit">دخول</button>
<button class="btn btn-secondary" type="button" id="forgotBtn" style="margin-top:10px">نسيت كلمة المرور؟</button>
<div id="loginMessage" style="margin-top:15px;text-align:center"></div>
</form>
</div>
</div>
<script src="../js/login.js" type="module"></script>
</body>
</html>
